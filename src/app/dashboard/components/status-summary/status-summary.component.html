<section class="summary" [attr.aria-label]="'summary.label' | t">
  @for (item of items; track item.status) {
    <article [class]="'summary-card ' + meta[item.status].className">
      <span class="summary-dot"></span>
      <div>
        <strong>{{ item.count }} {{ meta[item.status].label | t }}</strong>
        <p>{{ "summary." + item.status | t }}</p>
      </div>
      <app-icon [name]="icons[item.status]" />
    </article>
  }
</section>
