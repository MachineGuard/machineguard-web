<div class="login">
  <app-login-showcase class="showcase" aria-hidden="true" />

  <main class="panel">
    <div class="brand compact">
      <span class="brand-mark"><app-icon name="shield" /></span>MachineGuard
    </div>
    <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="lead">Accede a tu panel de monitoreo</p>

      @if (error(); as message) {
        <p class="form-error" role="alert">
          <app-icon name="error" />{{ message }}
        </p>
      }

      <label for="email">Correo electrónico</label>
      <div class="field" [class.invalid]="invalid('email')">
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@empresa.com"
          autocomplete="username"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          [attr.aria-invalid]="invalid('email')"
          [attr.aria-describedby]="invalid('email') ? 'email-error' : null"
        />
        <app-icon name="mail" />
      </div>
      @if (invalid("email")) {
        <p class="field-error" id="email-error">
          Ingresa un correo electrónico válido.
        </p>
      }

      <label for="password">Contraseña</label>
      <div class="field" [class.invalid]="invalid('password')">
        <input
          id="password"
          [type]="passwordVisible() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [attr.aria-invalid]="invalid('password')"
          [attr.aria-describedby]="invalid('password') ? 'password-error' : null"
        />
        <button
          type="button"
          class="reveal"
          [attr.aria-label]="
            passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'
          "
          [attr.aria-pressed]="passwordVisible()"
          (click)="passwordVisible.set(!passwordVisible())"
        >
          <app-icon [name]="passwordVisible() ? 'eye-off' : 'eye'" />
        </button>
      </div>
      @if (invalid("password")) {
        <p class="field-error" id="password-error">Ingresa tu contraseña.</p>
      }

      <button class="button primary submit" type="submit" [disabled]="submitting()">
        {{ submitting() ? "Ingresando…" : "Iniciar sesión" }}
        @if (!submitting()) {
          <app-icon name="arrow" />
        }
      </button>
    </form>
    <footer>
      <span>Términos</span><span aria-hidden="true">&middot;</span
      ><span>Privacidad</span><span aria-hidden="true">&middot;</span
      ><span>MachineGuard</span>
    </footer>
  </main>
</div>
