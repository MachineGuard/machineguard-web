<div class="login">
  <app-login-showcase class="showcase" aria-hidden="true" />

  <main class="panel">
    <div class="brand compact">
      <span class="brand-mark"><app-icon name="shield" /></span>MachineGuard
    </div>
    <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>{{ "login.title" | t }}</h1>
      <p class="lead">{{ "login.lead" | t }}</p>

      @if (error(); as message) {
        <p class="form-error" role="alert">
          <app-icon name="error" />{{ message | t }}
        </p>
      }

      <label for="email">{{ "login.email" | t }}</label>
      <div class="control" [class.invalid]="invalid('email')">
        <input
          id="email"
          type="email"
          formControlName="email"
          [placeholder]="'login.emailPlaceholder' | t"
          autocomplete="username"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          [attr.aria-invalid]="invalid('email')"
          [attr.aria-describedby]="invalid('email') ? 'email-error' : null"
        />
        <app-icon name="mail" />
      </div>
      @if (invalid("email")) {
        <p class="field-error" id="email-error">
          {{ "login.emailError" | t }}
        </p>
      }

      <label for="password">{{ "login.password" | t }}</label>
      <div class="control" [class.invalid]="invalid('password')">
        <input
          id="password"
          [type]="passwordVisible() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          [attr.aria-invalid]="invalid('password')"
          [attr.aria-describedby]="invalid('password') ? 'password-error' : null"
        />
        <button
          type="button"
          class="reveal"
          [attr.aria-label]="
            (passwordVisible() ? 'login.hide' : 'login.show') | t
          "
          [attr.aria-pressed]="passwordVisible()"
          (click)="passwordVisible.set(!passwordVisible())"
        >
          <app-icon [name]="passwordVisible() ? 'eye-off' : 'eye'" />
        </button>
      </div>
      @if (invalid("password")) {
        <p class="field-error" id="password-error">{{ "login.passwordError" | t }}</p>
      }

      <button class="button primary submit" type="submit" [disabled]="submitting()">
        {{ (submitting() ? "login.submitting" : "login.submit") | t }}
        @if (!submitting()) {
          <app-icon name="arrow" />
        }
      </button>
    </form>
    <footer>
      <span>{{ "common.terms" | t }}</span><span aria-hidden="true">&middot;</span
      ><span>{{ "common.privacy" | t }}</span><span aria-hidden="true">&middot;</span
      ><app-language-switch />
    </footer>
  </main>
</div>
