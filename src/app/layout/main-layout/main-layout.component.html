<a class="skip-link" href="#main-content">Skip to content</a>
<app-sidebar [open]="menuOpen()" (navigated)="menuOpen.set(false)" />
@if (menuOpen()) {
  <button
    class="backdrop"
    aria-label="Close navigation"
    (click)="menuOpen.set(false)"
  ></button>
}
<div class="workspace">
  <app-header
    [navigationOpen]="menuOpen()"
    (menuToggle)="menuOpen.set(!menuOpen())"
  />
  <main id="main-content"><router-outlet /></main>
  <footer class="workspace-footer">
    <span
      >Terms <span aria-hidden="true">&middot;</span> Privacy
      <span aria-hidden="true">&middot;</span> <strong>EN | ES</strong></span
    ><span>MachineGuard</span>
  </footer>
</div>
