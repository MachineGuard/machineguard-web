<a class="skip-link" href="#main-content">{{ "common.skip" | t }}</a>
<app-sidebar [open]="menuOpen()" (navigated)="menuOpen.set(false)" />
@if (menuOpen()) {
  <button
    class="backdrop"
    [attr.aria-label]="'nav.close' | t"
    (click)="menuOpen.set(false)"
  ></button>
}
<div class="workspace">
  <app-header
    [navigationOpen]="menuOpen()"
    (menuToggle)="menuOpen.set(!menuOpen())"
  />
  <main id="main-content"><router-outlet /></main>
  <footer class="workspace-footer">
    <span
      >{{ "common.terms" | t }} <span aria-hidden="true">&middot;</span> {{ "common.privacy" | t }}</span
    ><span>MachineGuard</span>
  </footer>
</div>
